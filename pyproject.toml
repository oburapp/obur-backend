[project]
name = "obur-backend"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.141.1",
    "fractional-indexing>=0.1.3",
    "geoalchemy2>=0.20.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "svix>=1.99.1",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is designed around calls-in-defaults
# (`param: T = Depends(...)`) — not the mutable-default-argument bug B008
# otherwise correctly guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pyright]
include = ["app", "tests", "migrations"]
pythonVersion = "3.12"
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, not one per test: app.core.database's
# async engine (and its pooled asyncpg connections) is a session-lived,
# module-level object — a fresh per-test loop would hand a later test a
# pooled connection tied to an already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine bridges sync DBAPI calls into the event loop
# via greenlet_spawn — without this, coverage.py's tracer loses exception
# propagation across that boundary (e.g. a service raising inside an
# integration test), undercounting otherwise-executed except branches.
concurrency = ["greenlet"]

[tool.coverage.report]
fail_under = 98
show_missing = true
